# Gera o índice de partidas por FIDE ID a partir das transmissões do Lichess e publica no GitHub
# Pages (https://chess-codex.github.io/dados-preparador/). Todo dia 8 (o Lichess publica o mês
# anterior nos primeiros dias) e sob demanda.
name: indice

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Meses (AAAA-MM, separados por vírgula). Vazio = todos'
        required: false
        default: ''
  schedule:
    - cron: '0 6 8 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: indice
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # lista oficial da FIDE compactada (scripts/lista-fide.mjs; o site da FIDE recusa os servidores do
      # GitHub, por isso ela fica no release "lista-fide"): casa o nome com o FIDE ID nas transmissões
      # antigas, sem a tag FideId. Sem ela, o índice sai só com as partidas que têm a tag.
      - name: Lista de jogadores da FIDE
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download lista-fide -R "$GITHUB_REPOSITORY" -p fide.tsv.gz
      # o campo entra por variável de ambiente, não direto no comando (evita injeção)
      - name: Gera o índice
        env:
          MONTH: ${{ inputs.month }}
        run: node --max-old-space-size=12288 scripts/indice.mjs --out site --month "$MONTH" --fide fide.tsv.gz
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
